name: Release connectors

# 连接器的发版。一件事两半：**版本号变了就发，发完留个 tag**。
#
# 触发方式有两种：
#
#   · 合进 main —— 版本号（version.json）跟上次发的不是同一个，就发一版。
#   · 人推 tag —— `git push origin v1.2.3`，指定版本发。
#
# **为什么 tag 与发版在同一趟里做完**：CI 用 GITHUB_TOKEN 推的 tag，GitHub 不会因为这个
# push 再触发一轮 workflow（防递归）。所以「推 tag」和「按 tag 发版」不能分成两趟 ——
# 分开的话，CI 自己打的 tag 永远等不到那一趟发版。
#
# 两条发布路径，分成两个 job：
#
#   · npm —— 装的时候可以写 `dsh plugin add @dotv/dsh-canvas`。走 Trusted Publishing
#     （OIDC），不碰 token。
#   · GitHub Release 的 tarball —— 同样的包，免构建授权直接装。**这条路不依赖 npm**，
#     所以 npm 那条还没配好时，DSH 用户照样装得上。

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  # npm 的 provenance 签名走 OIDC：不需要在仓里存一个长期 npm token。
  id-token: write

jobs:
  # —— 打 tag ——
  # 版本号变了就补一个 tag；人推的 tag 已经有了，什么都不做。
  tag:
    name: Tag the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish_npm: ${{ steps.plan.outputs.publish_npm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gates
        run: |
          node tooling/sync.mjs --check
          node tooling/verify-public-tree.mjs
          node tooling/verify-marketplaces.mjs
          node tooling/set-version.mjs --check

      - name: Work out what to publish
        id: plan
        run: |
          version=$(node -p "require('./version.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "publish_npm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "v$version 已经打过 tag 了 —— 版本号没变，这一趟不发。"
            echo "publish_npm=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "dotv-release[bot]"
          git config user.email "dotv-release[bot]@users.noreply.github.com"
          git tag "v$version"
          git push origin "v$version"
          echo "打了 tag v$version"
          echo "publish_npm=true" >> "$GITHUB_OUTPUT"

  # —— npm ——
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: tag
    if: needs.tag.outputs.publish_npm == 'true'
    # 这个仓的发版跑在 connectors 这个环境里 —— 环境上的保护规则在这一层生效，
    # Trusted Publisher 认的也是它。
    environment: connectors
    # 还没在 npm 上配 trusted publisher 时，这一步会因为要一次性 2FA 而红。
    # 那不影响 tarball 与 Release（另一个 job），所以这里放过它 —— 等配好了，把这行删掉。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 需要 npm >= 11.5.1，而 Node 22 自带的是 npm 10 —— 先升。
      - name: Use an npm that speaks trusted publishing
        run: npm install -g npm@latest

      - name: Publish the npm packages
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          shopt -s nullglob
          packages=(bundles/*/package.json)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "本仓里没有 bundle，没有 npm 包要发。"
            exit 0
          fi
          for manifest in "${packages[@]}"; do
            dir=$(dirname "$manifest")
            name=$(node -p "require('./$manifest').name")
            echo "发布 $name（$dir）"
            if ! npm publish --access public --provenance "$dir"; then
              echo "::error::$name 发布失败。检查它在 npm 上配没配 trusted publisher：GitHub Actions / dotv-ai / connectors / release.yml / environment connectors。"
              exit 1
            fi
          done

  # —— GitHub Release（tarball）——
  release:
    name: GitHub release (tarball)
    runs-on: ubuntu-latest
    needs: tag
    environment: connectors
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gates
        run: |
          node tooling/sync.mjs --check
          node tooling/verify-public-tree.mjs
          node tooling/verify-marketplaces.mjs
          node tooling/set-version.mjs --check

      - name: Open the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION 的 Release 已经在了，不重复建。"
            exit 0
          fi
          shopt -s nullglob
          tarballs=()
          for manifest in bundles/*/package.json; do
            dir=$(dirname "$manifest")
            name=$(node -p "require('./$manifest').name")
            package_version=$(node -p "require('./$manifest').version")
            tarball=$(npm pack --pack-destination "$RUNNER_TEMP" "$dir" | tail -1)
            # 名字里不带版本号：`releases/latest/download/<名字>` 每次都指向最新那版。
            # 带版本号的话，文档里的地址会在下一次发版后 404（文件名被字面取用）。
            stable="$RUNNER_TEMP/$(basename "$tarball" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+.*\.tgz$/.tgz/')"
            mv "$RUNNER_TEMP/$tarball" "$stable"
            tarballs+=("$stable")
            echo "$name@$package_version → $stable"
          done
          notes=$(printf '连接器 v%s。\n\n- npm 包：%s\n- tarball：DSH 用户免构建授权直接装。\n' \
            "$VERSION" "$(ls bundles | tr '\n' ' ')")
          if [ ${#tarballs[@]} -gt 0 ]; then
            gh release create "v$VERSION" "${tarballs[@]}" --title "connectors v$VERSION" --notes "$notes"
          else
            gh release create "v$VERSION" --title "connectors v$VERSION" --notes "$notes"
          fi
